services:
  postgres:
    image: postgres:15
    platform: linux/arm64
    environment:
      POSTGRES_DB: instauto
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "6380:6379"

volumes:
  pgdata:
